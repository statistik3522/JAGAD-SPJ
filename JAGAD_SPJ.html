<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAGAD SPJ — Daftar Periksa Kelengkapan SPJ BPS</title>
<meta name="description" content="Cek dan cetak daftar kelengkapan dokumen pertanggungjawaban belanja per akun, lengkap dengan syarat sah dan catatan verifikasi. Tanpa login.">
<style>
:root{--pur:#2B1559;--pur2:#4a2a8a;--org:#F26B1D;--lil:#EEE8F7;--ink:#241a3a;--mut:#645c7a;--line:#ddd5ee;--bg:#faf8fd;--ok:#1d6b40;--okbg:#d6f0e0;--warn:#9a3d08;--warnbg:#ffe6d5;--blue:#1d4aa0;--bluebg:#dce8ff;--gray:#8a839c}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;color:var(--pur)}
.hide{display:none!important}
header.top{background:var(--pur);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-weight:800;letter-spacing:.02em;font-size:19px}
.brand small{display:block;font-weight:400;font-size:11.5px;color:#d7c9f3;letter-spacing:0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#e6dcf7;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600}
nav button.on{background:var(--org);color:#fff}
nav button:hover:not(.on){background:rgba(255,255,255,.12)}
main{max-width:1240px;margin:0 auto;padding:16px}
.layout{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.side{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.side input{width:100%;padding:8px 10px;border:1px solid #c9bfe0;border-radius:8px;background:#fff;margin-bottom:8px}
.acc{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 6px;cursor:pointer;display:block}
.acc:hover{background:var(--lil)}
.acc.on{border-color:var(--org);background:#fff7f1}
.acc b{color:var(--pur);font-size:14px}
.acc span{display:block;font-size:12.5px;color:var(--mut)}
.schs{margin:2px 0 8px 10px;display:flex;flex-direction:column;gap:4px}
.schs button{text-align:left;border:0;background:transparent;padding:4px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--pur)}
.schs button.on{background:var(--pur);color:#fff}
.schs button:hover:not(.on){background:var(--lil)}
.sbox{position:relative}
.sbox input{padding-right:34px}
.sbox input::-webkit-search-cancel-button{display:none}
.qx{position:absolute;right:6px;top:5px;width:26px;height:26px;border:0;border-radius:50%;background:var(--lil);color:var(--pur);font-size:17px;line-height:1;cursor:pointer}
.sugg{border:1px solid var(--line);border-radius:10px;background:#fff;max-height:62vh;overflow:auto;margin-bottom:8px}
.sg-h{position:sticky;top:0;background:#f4effb;color:var(--pur2);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px}
.sg{display:block;width:100%;text-align:left;border:0;border-top:1px solid #f0eaf8;background:#fff;padding:7px 10px;cursor:pointer;font-size:14px;color:var(--ink)}
.sg small{display:block;color:var(--mut);font-size:12px;margin-top:1px}
.sg:hover,.sg.on{background:var(--lil)}
.sg.on{box-shadow:inset 3px 0 0 var(--org)}
.sg-n{padding:8px 10px;font-size:12.5px;color:var(--mut)}
mark{background:#ffe08a;color:inherit;border-radius:3px;padding:0 1px}
.stabs{display:flex;gap:4px;margin:0 0 8px;background:var(--lil);padding:3px;border-radius:9px}
.stabs button{flex:1;border:0;background:transparent;border-radius:7px;padding:5px 6px;font-size:12.5px;font-weight:700;color:var(--pur);cursor:pointer}
.stabs button.on{background:var(--pur);color:#fff}
.cnt{float:right;font-style:normal;font-size:11px;font-weight:700;background:var(--okbg);color:var(--ok);border-radius:99px;padding:1px 7px;margin-left:6px}
.grph.fav{color:var(--org)}
.it.hl{outline:3px solid var(--org);outline-offset:2px;border-radius:8px;background:#fff7f1}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.ttl small{display:block;color:var(--mut);font-size:13px;font-weight:600}
.ttl h2{font-size:21px;margin:2px 0 2px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--pur);margin:0 0 3px}
.meta input{width:100%;padding:8px 10px;border:1px solid #c9bfe0;border-radius:8px;background:#fff}
input:focus,select:focus{outline:2px solid var(--org);border-color:var(--org)}
.btn{background:var(--pur);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pur2)}
.btn.org{background:var(--org)}.btn.org:hover{background:#d95a10}
.btn.ghost{background:#fff;color:var(--pur);border:1px solid #b9a9e0}.btn.ghost:hover{background:var(--lil)}
.btn.sm{padding:5px 10px;font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.tools .chk{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--ink);font-weight:500;margin:0}
.info{background:var(--lil);border-radius:10px;padding:10px 14px;font-size:14px}
.info ul{margin:4px 0 0;padding-left:18px}
.prog{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar{flex:1 1 180px;height:10px;background:#e7e1f3;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--org);transition:width .2s}
.bar.done i{background:#2f8f5b}
.grp{background:var(--pur);color:#fff;font-weight:700;padding:7px 12px;border-radius:8px;margin:14px 0 6px;font-size:14px}
.it{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line)}
.it.na{opacity:.55}
.st{width:38px;height:38px;border-radius:9px;border:2px solid #b9a9e0;background:#fff;cursor:pointer;font-weight:800;font-size:15px;color:var(--pur)}
.st[data-s="1"]{background:var(--ok);border-color:var(--ok);color:#fff}
.st[data-s="2"]{background:#eceaf2;border-color:#bdb7cc;color:#5d566f;font-size:11px}
.st:disabled{cursor:not-allowed;background:#eceaf2;border-color:#d7d2e3;color:#8a839c;font-size:11px}
.it h3{font-size:15px;color:var(--ink);font-weight:700}
.it .no{color:var(--gray);font-weight:600;margin-right:4px}
.it p{margin:3px 0 0;font-size:14px;color:#3a3150}
.cond{margin:3px 0 0;font-size:13px;color:var(--warn);font-weight:600}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:6px;vertical-align:1px}
.tag.p{background:var(--okbg);color:var(--ok)}
.tag.s{background:var(--warnbg);color:var(--warn)}
.tag.r{background:#dfe9fb;color:#1d4aa0}
.grph{margin:12px 2px 6px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--pur2)}
.ref{margin-top:4px;font-size:12px;color:var(--mut)}
.tier{margin-top:5px;font-size:13.5px;background:#fff7f1;border:1px solid #f7c9a8;border-radius:8px;padding:4px 10px;display:inline-block;color:#7a3205;font-weight:600}
.kur{white-space:pre-wrap;background:#fff7f1;border:1px solid #f7c9a8;border-radius:8px;padding:10px;font-size:13.5px}
.legend{font-size:13px;color:var(--mut);margin-top:6px}
table.t{width:100%;border-collapse:collapse}
table.t th{background:var(--pur);color:#fff;text-align:left;padding:8px 10px;font-size:13px}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
.pj h3{font-size:17px;margin-bottom:6px}
.pj .a{color:var(--mut);font-size:13px;margin-bottom:6px}
.src li{margin-bottom:8px}
#print{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none}header.top{position:static}}
@media print{
 @page{size:A4;margin:12mm}
 body{background:#fff;font-size:10pt}
 header.top,main{display:none!important}
 #print{display:block}
 #print h1{font-size:14pt;text-align:center;margin:0}
 #print .sub{text-align:center;font-weight:700;margin:2px 0 8px}
 #print table{width:100%;border-collapse:collapse}
 #print .mt td{border:0;padding:1px 4px;font-size:9.5pt}
 #print .ct th,#print .ct td{border:1px solid #000;padding:3px 5px;font-size:9pt;vertical-align:top;color:#000}
 #print .ct th{background:#e9e9e9;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #print .ct tr{page-break-inside:avoid}
 #print .ct thead{display:table-header-group}
 #print .ct .g td{background:#f0f0f0;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #print .c{text-align:center;white-space:nowrap}
 #print .sm{font-size:8pt;color:#333}
 #print .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px;page-break-inside:avoid;font-size:9.5pt}
 #print .sig>div{text-align:center}
 #print .sig i{display:block;height:64px}
 #print .foot{margin-top:14px;font-size:8pt;color:#333}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">JAGAD SPJ<small>Jaga Administrasi dan Dokumen SPJ — daftar periksa terbuka, tanpa login</small></div>
  <nav id="nav">
    <button data-v="cek" class="on">Checklist</button>
    <button data-v="pajak">Ringkasan pajak</button>
    <button data-v="dasar">Dasar &amp; sumber</button>
    <button data-v="cara">Cara pakai</button>
  </nav>
</header>
<main>
  <section id="v-cek" class="layout">
    <aside class="side">
      <div class="sbox"><input id="q" type="search" placeholder="Ketik akun, kata, atau kalimat…" autocomplete="off" aria-label="Cari akun, skema, atau dokumen" aria-controls="sugg"><button id="q-x" class="qx hide" type="button" aria-label="Hapus pencarian">&times;</button></div>
      <div id="sugg" class="sugg hide" role="listbox" aria-label="Rekomendasi hasil pencarian"></div>
      <div id="stabs" class="stabs" role="tablist"><button data-t="grp" class="on" type="button">Kelompok akun</button><button data-t="kode" type="button">Urut kode</button></div>
      <div id="accs"></div>
    </aside>
    <div id="work"></div>
  </section>
  <section id="v-pajak" class="hide"></section>
  <section id="v-dasar" class="hide"></section>
  <section id="v-cara" class="hide"></section>
</main>
<div id="print"></div>

<script>
/* JAGAD SPJ — pustaka checklist. Semua butir bersumber dari dokumen yang diunggah pengguna.
   v: 'P' = tertulis dalam Perka BPS 13/2026 (ketentuan); 'S' = praktik/lembar kerja satker atau materi Rakor — perlu divalidasi ke ketentuan terbaru.
   src: kode sumber (lihat SRC).  th: ambang nilai (Rp) — butir hanya berlaku bila nilai transaksi > th.  */

const SRC = {
  P13: { t: 'Perka BPS No. 13 Tahun 2026 tentang Pedoman Administrasi Keuangan Kegiatan Sensus dan Survei di Lingkungan BPS', k: 'Ditetapkan 20 Januari 2026; mencabut Perka BPS No. 8 Tahun 2024. Berkas: "1 PERKA BPS No 13 Thn 2026 ttg PAK Sensus dan Survei.pdf".' },
  K24: { t: 'Kriteria Kesesuaian SPJ (lembar kerja satker, berkas "Kriteria Kesesuaian SPJ.xlsx", 2024)', k: 'Versi lebih lama (merujuk SBM 2023 dan PAK sebelumnya). Bila berbeda dengan Perka 13/2026, Perka 13/2026 yang dipakai.' },
  CKL: { t: 'Checklist SPJ Pelatihan Petugas Survei (SKP/SKNP 2026)', k: 'Lembar kerja satker untuk belanja bahan (521211), honor pengajar (521213), dan transport peserta (524114).' },
  RKR: { t: 'Materi Rakor Administrasi Persiapan Akhir TA 2026, BPS Provinsi Jawa Timur, 12 Oktober 2026', k: 'Hasil pendampingan administrasi 38 kabupaten/kota; kontrol dan temuan berulang.' },
  CTH: { t: 'Contoh lembar checklist kelengkapan SPJ SE2026 (BPS Kab. Malang)', k: 'Format lembar dengan kolom PPK dan PPSPM; dipakai sebagai acuan tata letak cetak dan berkas pembayaran.' },
  PKP: { t: 'Checklist SPJ & Administrasi PKPP SE2026 (BPS Kab. Bojonegoro)', k: 'Khusus pelatihan petugas pengganti.' }
};

const GRP = { REN: 'A. Perencanaan dan legalitas', PEL: 'B. Pelaksanaan dan bukti prestasi', KEU: 'C. Keuangan dan pajak', PAY: 'D. Berkas pembayaran', UJI: 'E. Uji konsistensi akhir' };

const LIB = {
  kak: { g: 'REN', n: 'Kerangka Acuan Kegiatan (KAK)', v: 'P', src: ['P13', 'RKR'], d: 'Perka 13/2026, butir Kelengkapan Tagihan Pembayaran',
    s: 'Diajukan oleh Penanggung Jawab kegiatan dan diketahui PPK. Menjelaskan kebutuhan, spesifikasi, dan volume secara memadai, bukan membenarkan transaksi yang sudah terjadi. Tidak memuat redaksi salinan dari kegiatan lain dan tidak menyebut nama penyedia atau lokasi final sebelum pemilihan selesai. Bertanggal sebelum komitmen dan pelaksanaan; isinya konsisten dengan undangan, daftar hadir, kontrak, dan pembayaran.' },
  fp: { g: 'REN', n: 'Form Permintaan (Penanggung Jawab Kegiatan kepada PPK)', v: 'P', src: ['P13', 'RKR', 'CKL'], d: 'Perka 13/2026, butir Kelengkapan Tagihan Pembayaran',
    s: 'Pintu awal sebelum PPK membuat komitmen. Harus ada, selaras dengan realisasi, dan bertanggal sebelum kegiatan atau transaksi berjalan. Pada praktik satker diajukan melalui aplikasi BOS.' },
  komit: { g: 'REN', n: 'Dokumen komitmen (sesuai nilai pengadaan)', v: 'P', src: ['P13', 'RKR'], tier: true, d: 'Perka 13/2026, butir Komitmen dalam bentuk kontrak',
    s: 'Pilih bentuk sesuai nilai: bukti pembelian/pembayaran (paling banyak Rp10 juta); kuitansi (paling banyak Rp50 juta); Surat Perintah Kerja/SPK (di atas Rp50 juta s.d. Rp200 juta); Surat Perjanjian (di atas Rp200 juta); atau Surat/Bukti Pesanan bila melalui e-purchasing — sesuai ketentuan PBJ pemerintah. Tanggal komitmen mendahului pelaksanaan; hindari dokumen susulan (post-facto).' },
  komit2: { g: 'REN', n: 'Dokumen komitmen (bukti pembelian atau kuitansi)', v: 'P', src: ['P13'], tier: true, d: 'Perka 13/2026 Bab XIV.D.3',
    s: 'Untuk paket data/pulsa: bukti pembelian/pembayaran (paling banyak Rp10 juta) atau kuitansi (paling banyak Rp50 juta).' },
  prestasi: { g: 'PEL', n: 'Bukti prestasi pekerjaan', v: 'P', src: ['P13', 'RKR'], d: 'Perka 13/2026, butir Bukti Prestasi Pekerjaan',
    s: 'Berita Acara Penyelesaian Pekerjaan, BAST Pekerjaan/Barang, Berita Acara Pembayaran, Berita Acara Kemajuan Pekerjaan, dan/atau bukti penyelesaian lainnya sesuai ketentuan PBJ. Harus merujuk ke dokumen komitmen (nomor dan tanggal), dan tidak terbit sebelum pekerjaan teruji.' },
  kuitansi: { g: 'KEU', n: 'Kuitansi/bukti pembayaran dan nota pembelian asli', v: 'S', src: ['K24'], d: 'Kriteria Kesesuaian SPJ (lembar kerja satker)',
    s: 'Kuitansi bermaterai sesuai ketentuan bea meterai; nota/struk asli dari penyedia. Nama, tanggal, nilai, dan rincian sesuai dokumen komitmen. Jenis pajak ditentukan dari kuitansi pembelian.' },
  alokasi: { g: 'PEL', n: 'Daftar alokasi / tanda terima barang yang diserahkan', v: 'P', src: ['P13', 'K24'], d: 'Perka 13/2026 Bab IV.D.4',
    s: 'Memuat penerima, jenis, dan jumlah barang yang diserahkan, ditandatangani penerima. Jumlah sesuai nota dan KAK.' },
  ppn: { g: 'KEU', n: 'Faktur Pajak dan SSP/bukti setor PPN', v: 'P', src: ['P13', 'CKL'], th: 2000000, c: 'Rekanan PKP dan nilai transaksi di atas Rp2.000.000 (tidak termasuk PPN).', d: 'Perka 13/2026 Bab XV.E',
    s: 'Tarif 12% dengan DPP nilai lain (11/12 × harga jual). Untuk rekanan non-PKP, PPN tetap dipungut Instansi Pemerintah dengan SSP/ID Billing tanpa faktur pajak (Pasal 126 PER-11/PJ/2025 sebagaimana dikutip Perka). Tidak dipungut untuk transaksi paling banyak Rp2 juta yang bukan pecahan, pembayaran dengan KKP, dan pengecualian lain (tab Pajak). Setor paling lama 7 hari setelah pembayaran UP.' },
  pph22: { g: 'KEU', n: 'SSP/bukti setor PPh Pasal 22 (1,5%)', v: 'P', src: ['P13'], th: 2000000, c: 'Pembelian barang (warung/toko) di atas Rp2.000.000, tidak termasuk PPN.', d: 'Perka 13/2026 Bab XV.B',
    s: 'Dasar: harga pembelian tidak termasuk PPN. Memakai NPWP rekanan; bila tidak ada, NIK pemilik usaha. Dikecualikan: pembayaran dengan KKP; BBM, benda pos, air, telepon, listrik; rekanan yang menyerahkan fotokopi surat keterangan bebas. Setor paling lama 7 hari setelah pembayaran UP. Bukti setor ditempel pada dossier SPM terkait dan direviu sebelum SPP/SPM.' },
  pph23: { g: 'KEU', n: 'SSP/bukti setor PPh Pasal 23 (2%)', v: 'P', src: ['P13'], c: 'Jasa katering/boga, jasa lainnya, sewa selain tanah/bangunan, penyelenggaraan paket meeting, pengiriman.', d: 'Perka 13/2026 Bab XV.C',
    s: 'Tanpa batas minimal nilai. Memakai NPWP usaha rekanan; bila tidak ada NPWP usaha, gunakan NIK pemilik usaha dengan PPh 21 sebesar 50% × 5% dari nilai tagihan. Setor paling lama 7 hari setelah pembayaran UP.' },
  pph21: { g: 'KEU', n: 'SSP/bukti setor PPh Pasal 21', v: 'P', src: ['P13', 'CKL'], d: 'Perka 13/2026 Bab XV.A',
    s: 'Disesuaikan dengan peraturan perpajakan: DPP dan tarif berbeda untuk PNS/TNI/Polri (final), PPPK/pegawai tidak tetap, bukan pegawai (DPP 50% × bruto), dan peserta kegiatan. Honor mitra satuan O-B: perhatikan PTKP, bila honor sebulan tidak melebihi PTKP tidak dipotong. Rincian pada tab Pajak.' },
  transfer: { g: 'PAY', n: 'Bukti transfer bank / CMS (pembayaran nontunai)', v: 'S', src: ['K24', 'RKR', 'CTH'], d: 'Materi Rakor Prov. Jatim 12/10/2026; Kriteria Kesesuaian SPJ',
    s: 'Nontunai adalah kebiasaan utama. Nomor rekening pada SPJ harus sama dengan bukti transfer; bukti transfer cocok dengan rekap kuitansi dan ditempel pada transaksi penerima yang tepat. Retur atau rekening tidak aktif segera direkonsiliasi dan dicatat sebagai exception.' },
  tunai: { g: 'PAY', n: 'Dokumen pengecualian pembayaran tunai', v: 'S', src: ['K24', 'RKR'], c: 'Hanya bila dibayar tunai.', d: 'Kriteria Kesesuaian SPJ; Rakor 12/10/2026 (menyebut Perka BPS No. 7 Tahun 2024 tentang transaksi nontunai)',
    s: 'Pengecualian yang terdokumentasi: surat pernyataan KPA / SPTJM untuk pembayaran tunai, surat pendelegasian wewenang Bendahara, kuitansi ditandatangani penerima, dan foto dokumentasi penyerahan uang.' },
  sk: { g: 'REN', n: 'SK KPA / SK KBPS', v: 'P', src: ['P13'], d: 'Perka 13/2026 Bab VII', s: 'Memuat nama, tugas dan fungsi, serta besaran rate sesuai ketetapan SBM/SBKS. Mutakhir terhadap kondisi lapangan (perubahan petugas diikuti pembaruan SK).' },
  daftarhadir: { g: 'PEL', n: 'Daftar hadir', v: 'P', src: ['P13', 'RKR'], d: 'Perka 13/2026, butir Daftar Hadir',
    s: 'Ditandatangani lengkap. Jumlah undangan = jumlah hadir = jumlah konsumsi/transport/roomlist; selisih dijelaskan tertulis. Peserta yang tidak hadir dijelaskan dalam notulen/laporan.' },
  undangan: { g: 'PEL', n: 'Surat undangan', v: 'P', src: ['P13', 'CKL'], d: 'Perka 13/2026, butir Undangan',
    s: 'Memuat hari/tanggal, waktu, tempat, dan peserta. Selaras dengan KAK, daftar hadir, dan jadwal.' },
  jadwal: { g: 'PEL', n: 'Jadwal kegiatan', v: 'P', src: ['P13', 'CKL'], d: 'Perka 13/2026, butir Jadwal kegiatan',
    s: 'Mengikuti jadwal pada pedoman penyelenggaraan; mencantumkan sesi dan jam sehingga durasi kegiatan dapat diuji.' },
  notulen: { g: 'PEL', n: 'Notulen / laporan kegiatan dan dokumentasi', v: 'P', src: ['P13', 'RKR'], d: 'Perka 13/2026, butir Notulensi dan Dokumentasi',

/* ---------- pencarian dengan rekomendasi ---------- */
var IDX=null,sres=[],sact=-1;
function buildIdx(){
  IDX=[];
  ACCOUNTS.forEach(function(a){
    IDX.push({t:'a',a:a,s:a.schemes[0],label:a.kode+' '+a.nama,sub:a.ket,title:(a.kode+' '+a.nama).toLowerCase(),body:(a.ket+' '+(a.grp||'')).toLowerCase()});
    a.schemes.forEach(function(s){
      IDX.push({t:'s',a:a,s:s,label:s.nama,sub:'Akun '+a.kode+' · '+a.nama,title:s.nama.toLowerCase(),body:(a.kode+' '+a.nama+' '+a.ket+' '+(s.dasar||'')).toLowerCase()});
      resolve(s).forEach(function(g){g.items.forEach(function(i){
        IDX.push({t:'d',a:a,s:s,id:i.id,label:i.n,sub:'Akun '+a.kode+' · '+s.nama,title:i.n.toLowerCase(),body:((i.s||'')+' '+(i.d||'')+' '+(i.c||'')).toLowerCase()});
      })});
    });
  });
}
function searchIdx(q){
  if(!IDX)buildIdx();
  var ql=q.toLowerCase().trim().replace(/\s+/g,' '),tk=ql.split(' ').filter(Boolean),out=[];
  IDX.forEach(function(e,n){
    var sc=0,ok=true;
    for(var k=0;k<tk.length;k++){
      var w=tk[k],it=e.title.indexOf(w),ib=e.body.indexOf(w);
      if(it<0&&ib<0){ok=false;break}
      sc+=it>=0?(it===0?5:3):1;
    }
    if(!ok)return;
    if(tk.length>1){if(e.title.indexOf(ql)>=0)sc+=6;else if(e.body.indexOf(ql)>=0)sc+=2}
    if(e.t==='a'&&e.a.kode.indexOf(tk[0])===0)sc+=8;
    if(e.t==='a')sc+=2;
    if(e.t==='s')sc+=1;
    out.push({e:e,sc:sc,n:n});
  });
  out.sort(function(x,y){return y.sc-x.sc||x.n-y.n});
  var cap={a:5,s:8,d:25},got={a:[],s:[],d:[]},tot={a:0,s:0,d:0};
  out.forEach(function(r){var t=r.e.t;tot[t]++;if(got[t].length<cap[t])got[t].push(r.e)});
  return {got:got,tot:tot};
}
function hlText(txt,tk){
  var s=esc(txt);
  tk.forEach(function(w){if(!w)return;var re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');s=s.replace(re,function(m){return /^&|;$/.test(m)?m:'<mark>'+m+'</mark>'})});
  return s;
}
function renderSugg(){
  var q=query.trim(),box=$('#sugg');
  $('#q-x').classList.toggle('hide',!q);
  if(!q){box.classList.add('hide');box.innerHTML='';sres=[];sact=-1;renderAccs();return}
  var r=searchIdx(q),tk=q.toLowerCase().split(/\s+/).filter(Boolean),h='';
  sres=[];
  [['a','Akun belanja'],['s','Skema'],['d','Dokumen / syarat']].forEach(function(g){
    var l=r.got[g[0]];if(!l.length)return;
    h+='<div class="sg-h">'+g[1]+' ('+r.tot[g[0]]+')</div>';
    l.forEach(function(e){
      var k=sres.length;sres.push(e);
      h+='<button type="button" class="sg" role="option" data-k="'+k+'"><span>'+hlText(e.label,tk)+'</span><small>'+hlText(e.sub,tk)+'</small></button>';
    });
    if(r.tot[g[0]]>l.length)h+='<div class="sg-n">+'+(r.tot[g[0]]-l.length)+' hasil lain — tambahkan kata kunci agar lebih spesifik.</div>';
  });
  if(!sres.length)h='<div class="sg-n">Tidak ada rekomendasi untuk “'+esc(q)+'”. Coba kata yang lebih umum, mis. kuitansi, honor, hotel, SPKL, atau nomor akun.</div>';
  box.innerHTML=h;box.classList.remove('hide');sact=-1;renderAccs();
}
function setAct(n){
  var b=[].slice.call(document.querySelectorAll('#sugg .sg'));if(!b.length)return;
  sact=(n+b.length)%b.length;
  b.forEach(function(x,i){x.classList.toggle('on',i===sact)});
  b[sact].scrollIntoView({block:'nearest'});
}
function pick(e){
  query='';var q=$('#q');q.value='';$('#sugg').classList.add('hide');$('#sugg').innerHTML='';$('#q-x').classList.add('hide');sres=[];sact=-1;
  go(e.a.kode,e.s.id);
  if(e.t==='d'){
    var el=document.querySelector('.it[data-id="'+e.id+'"]');
    if(el){el.classList.add('hl');if(el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(function(){el.classList.remove('hl')},3500)}
  }
}
$('#q').addEventListener('input',function(){query=this.value;renderSugg()});
$('#q').addEventListener('keydown',function(ev){
  if(ev.key==='ArrowDown'){ev.preventDefault();setAct(sact+1)}

  else if(ev.key==='Enter'){if(sres.length){ev.preventDefault();pick(sres[sact>=0?sact:0])}}
  else if(ev.key==='Escape'){query='';this.value='';renderSugg()}
});

function go(a,s,noHash){
  cur.acc=a;cur.sch=s;

}

/* ---------- panel kerja ---------- */
function tierText(it,nilai){
  if(!nilai)return '';
  var t;
  if(nilai<=10000000)t='bukti pembelian/pembayaran atau kuitansi';
  else if(nilai<=50000000)t='kuitansi';
  else if(it.id==='komit2')t='di luar batas yang diatur Bab XIV (kuitansi paling banyak Rp50 juta) — tinjau ke PPK';
  else if(nilai<=200000000)t='Surat Perintah Kerja (SPK)';
  else t='Surat Perjanjian';
  return 'Nilai '+rp(nilai)+' → '+t+(it.id==='komit2'?'':' (atau Surat/Bukti Pesanan bila e-purchasing)');
}
function applicable(it,s){
  var nilai=parseNum(s.nilai);
  if(nilai>0&&typeof it.th==='number'&&nilai<=it.th)return false;
  return true;
}
function stats(groups,s){
  var tot=0,ok=0,na=0,miss=[];
  groups.forEach(function(g){g.items.forEach(function(i){
    var m=s.m[i.id]||0;
    if(!applicable(i,s)||m===2){na++;return}
    tot++;if(m===1)ok++;else miss.push(i);
  })});
  return {tot:tot,ok:ok,na:na,miss:miss};
}

  if(sc.info&&sc.info.length)h+='<div class="info card"><b>Catatan skema</b><ul>'+sc.info.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';

function copy(txt,btn){

}

   +'<li>Perka 13/2026 Bab XI menulis PPN pengiriman 1,1% sementara Bab XV menyebut tarif 12% dengan DPP nilai lain; keduanya ditampilkan apa adanya, mohon konfirmasi ke Bendahara.</li>'
   +'</ul></div>';
  $('#v-dasar').innerHTML=h;
}
function renderCara(){
  $('#v-cara').innerHTML='<div class="card"><h2>Cara pakai</h2><ol>'
   +'<li>Pilih <b>akun belanja</b> di daftar kiri (atau ketik kata kunci), lalu pilih <b>skema</b> yang sesuai — misalnya akun 521213 punya skema honor tim, pengajar, petugas mitra, dan PNS BPS.</li>'
   +'<li>Isi <b>nilai transaksi</b> bila ingin aplikasi menunjuk bentuk dokumen komitmen yang tepat dan menandai pajak yang tidak berlaku (batas Rp2 juta).</li>'
   +'<li>Ketuk kotak status pada tiap dokumen: kosong → ✓ ada → T/B. Baca <b>syarat sah dan catatan verifikasi</b> di bawah nama dokumen.</li>'
   +'<li>Gunakan <b>Salin kekurangan</b> untuk menyalin daftar dokumen yang belum ada, atau <b>Cetak lembar checklist</b> untuk lembar A4 dengan kolom PJ, PPK, dan PPSPM serta kolom tanda tangan.</li>'

   +'<p class="legend">Tanpa login, tanpa server. Centang dan isian hanya disimpan di peramban perangkat ini.</p></div>';
}
$('#nav').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  [].forEach.call(document.querySelectorAll('#nav button'),function(x){x.classList.toggle('on',x===b)});
  ['cek','pajak','dasar','cara'].forEach(function(v){$('#v-'+v).classList.toggle('hide',v!==b.getAttribute('data-v'))});
  $('#v-cek').style.display=b.getAttribute('data-v')==='cek'?'':'none';
});
window.addEventListener('beforeprint',function(){var r=schemeOf(cur.acc,cur.sch);if(r)buildPrint(r.s,resolve(r.s))});

renderPajak();renderDasar();renderCara();
var m=(location.hash||'').match(/^#(\d{6})\/(\w+)$/);
if(m&&schemeOf(m[1],m[2])){go(m[1],m[2],true)}else{renderAccs();renderWork()}
window.JAGAD={ACCOUNTS:ACCOUNTS,LIB:LIB,resolve:resolve};
})();
